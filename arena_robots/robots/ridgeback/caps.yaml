mobile:
  source: https://www.mybotshop.de/Datasheet/Datasheet_Clearpath_Ridgeback.pdf
  odom_frame: odom

  polygons_dict:
    StopPolygon:
      type: polygon
      points: [[0.48, 0.40], [0.48, -0.40], [-0.48, -0.40], [-0.48, 0.40]]
      action_type: stop
      min_points: 4
      visualize: true
      polygon_pub_topic: polygon_stop
      enabled: true

  footprint_padding: 0.1

  velocity_limits:
    linear: [-1.1, 1.1]
    angular: [-1.0, 1.0]

  planar:
    velocity: {linear: [-1.1, 1.1], lateral: [0.0, 0.0], angular: [-1.0, 1.0]}
    acceleration: {linear: 2.0, lateral: .inf, angular: 2.0}
    gain: {linear: 1.0, lateral: 1.0, angular: 1.23}
    lag: 0.0
    traction: 9.81
    pivot: 0.319
    timeout: 0.5

  actions:
    continuous:
      linear:
        min: -2.0
        max: 2.0
      angular:
        min: -4.0
        max: 4.0
    discrete:
    - angular: 0.0
      linear: 0.3
      name: move_forward
    - angular: 0.0
      linear: -0.15
      name: move_backward
    - angular: 0.35
      linear: 0.15
      name: turn_left
    - angular: -0.35
      linear: 0.15
      name: turn_right
    - angular: 0.75
      linear: 0.0
      name: turn_strong_left
    - angular: -0.75
      linear: 0.0
      name: turn_strong_right
    - angular: 0.0
      linear: 0.0
      name: stop

power:
  robot_model: "ridgeback"

  power_system:
    system_voltage_v: 24.0
    global_drivetrain_efficiency: 0.85
    heating_coefficient_ch: 0.05
    battery_capacity_wh: 270.0
    drivetrain_damping: 0.2
    drivetrain_friction: 0.5
    rolling_resistance_crr: 0.04

  joint_metrics:
    topic: "joint_states"

  static_power_w:
    compute_core: 20.0
    idle_motors: 15.0

acoustics:
  L_base_0: 40.0
  beta_0: 58.5
  beta_1: 20.0
  beta_2: 14.0
  beta_3: 0.0
  omega_ref: 10.2
  tau_ref: 2.0
  max_joint_torque_nm: 15.0
  omega_deadband: 0.05
  omega_active: 0.50
  sigma_base: 0.8
  sigma_dynamic: 1.2
  sigma_no_effort: 2.0
