controller_manager:
  ros__parameters:
    use_sim_time: true
    update_rate: 50

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    robotnik_base_controller:
      type: arena_swerve_controller/SwerveController

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true
    publish_rate: 50

robotnik_base_controller:
  ros__parameters:
    use_sim_time: true

    # Order: front_right, front_left, back_right, back_left
    wheel_joint_names:
      - robot_front_right_wheel_joint
      - robot_front_left_wheel_joint
      - robot_back_right_wheel_joint
      - robot_back_left_wheel_joint
    steering_joint_names:
      - robot_front_right_steering_joint
      - robot_front_left_steering_joint
      - robot_back_right_steering_joint
      - robot_back_left_steering_joint

    max_steering_angle: 2.8
    allow_reverse_drive: true
    cmd_vel_timeout: 0.5
    use_stamped_vel: true

    publish_odom: true
    publish_tf: false
    odom_frame_id: odom
    base_frame_id: robot_base_footprint

    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true
    linear.x.min_velocity: .nan
    linear.x.max_velocity: .nan
    linear.x.min_acceleration: .nan
    linear.x.max_acceleration: .nan

    linear.y.has_velocity_limits: true
    linear.y.has_acceleration_limits: true
    linear.y.min_velocity: .nan
    linear.y.max_velocity: .nan
    linear.y.min_acceleration: .nan
    linear.y.max_acceleration: .nan

    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true
    angular.z.min_velocity: .nan
    angular.z.max_velocity: .nan
    angular.z.min_acceleration: .nan
    angular.z.max_acceleration: .nan

arm_controller:
  ros__parameters:
    joints:
      - robot_arm_shoulder_pan_joint
      - robot_arm_shoulder_lift_joint
      - robot_arm_elbow_joint
      - robot_arm_wrist_1_joint
      - robot_arm_wrist_2_joint
      - robot_arm_wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
