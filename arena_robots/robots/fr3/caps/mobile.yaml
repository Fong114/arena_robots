odom_frame: odom
drive: false
sensor_frame: lidar
radius: 0.35
is_holonomic: false

footprint: [[0.3, 0.3], [0.3, -0.3], [-0.3, -0.3], [-0.3, 0.3]]

velocity_limits:
  linear: [0.0, 0.0]
  angular: [0.0, 0.0]

acceleration_limits:
  linear: 0.0
  angular: 0.0

planar:
  velocity: {linear: [0.0, 0.0], lateral: [0.0, 0.0], angular: [0.0, 0.0]}
  acceleration: {linear: 0.0, lateral: 0.0, angular: 0.0}
  gain: {linear: 1.0, lateral: 1.0, angular: 1.0}
  lag: 0.0
  traction: 0.0
  pivot: 0.0
  timeout: 0.25

actions:
  continuous:
    linear:
      min: 0.0
      max: 0.0
    angular:
      min: 0.0
      max: 0.0
  discrete:
    - angular: 0.0
      linear: 0.0
      name: stop

laser:
  angle:
    increment: 0.00872664626
    max: 3.14159
    min: -3.14159
  num_beams: 360
  range: 12.0
  update_rate: 10
