mobile:
  source: https://www.neobotix-robots.com/fileadmin/images/downloads/Datenbl%C3%A4tter/Data-Sheet_MPO-700.pdf
  odom_frame: odom

  velocity_limits:
    linear: [-0.8, 0.8]
    angular: [-1.0, 1.0]
    lateral: [-0.8, 0.8]

  polygons_dict:
    StopPolygon:
      type: polygon
      points: [[0.30, 0.20], [0.30, -0.20], [-0.30, -0.20], [-0.30, 0.20]]
      action_type: stop
      min_points: 3
      visualize: true
      polygon_pub_topic: polygon_stop
      enabled: true

  planar:
    velocity: {linear: [-.inf, .inf], lateral: [-.inf, .inf], angular: [-.inf, .inf]}
    acceleration: {linear: .inf, lateral: .inf, angular: .inf}
    gain: {linear: 1.0, lateral: 1.0, angular: 1.0}
    lag: 0.0
    traction: 9.81
    pivot: 0.0
    timeout: 0.5

  actions:
    continuous:
      linear:
        min: -0.8
        max: 0.8
      angular:
        min: -1.0
        max: 1.0
    discrete:
      - {name: move_forward,  linear: 0.3,  angular: 0.0}
      - {name: move_backward, linear: -0.3, angular: 0.0}
      - {name: turn_left,     linear: 0.0,  angular: 0.5}
      - {name: turn_right,    linear: 0.0,  angular: -0.5}
      - {name: strafe_left,   linear: 0.0,  lateral: 0.3,  angular: 0.0}
      - {name: strafe_right,  linear: 0.0,  lateral: -0.3, angular: 0.0}
      - {name: stop,          linear: 0.0,  angular: 0.0}

power:
  robot_model: "mpo700"

  power_system:
    system_voltage_v: 24.0
    global_drivetrain_efficiency: 0.85
    heating_coefficient_ch: 0.05
    battery_capacity_wh: 270.0
    drivetrain_damping: 0.3
    drivetrain_friction: 0.6
    rolling_resistance_crr: 0.035

  joint_metrics:
    topic: "joint_states"

  static_power_w:
    compute_core: 20.0
    idle_motors: 15.0

acoustics:
  L_base_0: 40.0
  beta_0: 58.5
  beta_1: 20.0
  beta_2: 14.0
  beta_3: 0.0
  omega_ref: 10.2
  tau_ref: 2.0
  max_joint_torque_nm: 15.0
  omega_deadband: 0.05
  omega_active: 0.50
  sigma_base: 0.8
  sigma_dynamic: 1.2
  sigma_no_effort: 2.0
