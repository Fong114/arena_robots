controller_manager:
  ros__parameters:
    use_sim_time: true
    update_rate: 50
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    rskomni_velocity_controller:
      type: arena_omni_drive_controller/OmniDriveController

rskomni_velocity_controller:
  ros__parameters:
    use_sim_time: true
    # 3-wheel omni at 120 deg spacing, wheel joints defined in rskomnidirectional.urdf.xacro
    wheel_joint_names: [wheel1_speed, wheel2_speed, wheel3_speed]

    direction:         ccw

    cmd_vel_timeout:   0.5
    use_stamped_vel:   true
    publish_odom:      true
    publish_tf:        false

    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true

    linear.y.has_velocity_limits: true
    linear.y.has_acceleration_limits: true

    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true
    pose_covariance_diagonal:  [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.03]
    twist_covariance_diagonal: [0.001, 0.001, 0.001,     1000000.0, 1000000.0, 0.03]
