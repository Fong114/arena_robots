mobile:
  source: https://docs.pal-robotics.com/edge/hardware/tiago/mobile-base
  odom_frame: odom

  polygons_dict:
    StopPolygon:
      type: polygon
      points: [[0.33, 0.0], [0.24, 0.24], [0.0, 0.33], [-0.24, 0.24], [-0.33, 0.0], [-0.24, -0.24], [0.0, -0.33], [0.24, -0.24]]
      action_type: stop
      min_points: 4
      visualize: true
      polygon_pub_topic: polygon_stop
      enabled: true

  velocity_limits:
    linear: [-1.0, 1.0]
    angular: [-1.5, 1.5]
  acceleration_limits:
    linear: 1.0
    angular: 2.0

  planar:
    velocity: {linear: [-1.0, 1.0], lateral: [0.0, 0.0], angular: [-1.5, 1.5]}
    acceleration: {linear: 1.0, lateral: .inf, angular: 2.0}
    gain: {linear: 1.0, lateral: 1.0, angular: 1.0}
    lag: 0.0
    traction: 4.9
    pivot: 0.0
    timeout: 0.25

  actions:
    continuous:
      linear:
        min: -1.0
        max: 1.0
      angular:
        min: -1.5
        max: 1.5
    discrete:
      - angular: 0.0
        linear: 0.3
        name: move_forward
      - angular: 0.0
        linear: -0.15
        name: move_backward
      - angular: 0.35
        linear: 0.15
        name: turn_left
      - angular: -0.35
        linear: 0.15
        name: turn_right
      - angular: 0.75
        linear: 0.0
        name: turn_strong_left
      - angular: -0.75
        linear: 0.0
        name: turn_strong_right
      - angular: 0.0
        linear: 0.0
        name: stop

arm:
  arm:
    base_link: torso_lift_link
    tip_link: arm_tool_link
    chain:
      - arm_1_joint
      - arm_2_joint
      - arm_3_joint
      - arm_4_joint
      - arm_5_joint
      - arm_6_joint
      - arm_7_joint
    controller: arm_controller
    moveit:
      planning_group: arm
      robot_name: tiago
      srdf:
        package: arena_robots
        path: robots/tiago/srdf/arm.srdf.xacro
      joint_limits:
        package: arena_robots
        path: robots/tiago/srdf/joint_limits.yaml
    workspace:
      type: box
      frame: base_link
      min: [0.3, -0.5, 0.4]
      max: [0.9, 0.5, 1.3]
    named_poses:
      stow:
        joints:
          arm_1_joint: 0.50
          arm_2_joint: -1.34
          arm_3_joint: -0.48
          arm_4_joint: 1.94
          arm_5_joint: -1.49
          arm_6_joint: 1.37
          arm_7_joint: 0.0
      ready:
        joints:
          arm_1_joint: 0.21
          arm_2_joint: -0.2
          arm_3_joint: -2.2
          arm_4_joint: 1.15
          arm_5_joint: -1.57
          arm_6_joint: 0.2
          arm_7_joint: 0.0
      wave_up:
        joints:
          arm_1_joint: 0.21
          arm_2_joint: -0.2
          arm_3_joint: -2.2
          arm_4_joint: 1.9
          arm_5_joint: -1.57
          arm_6_joint: 0.2
          arm_7_joint: 0.0
      wave_l:
        joints:
          arm_1_joint: 0.21
          arm_2_joint: -0.2
          arm_3_joint: -2.2
          arm_4_joint: 1.9
          arm_5_joint: -1.57
          arm_6_joint: 0.8
          arm_7_joint: 0.0
      wave_r:
        joints:
          arm_1_joint: 0.21
          arm_2_joint: -0.2
          arm_3_joint: -2.2
          arm_4_joint: 1.9
          arm_5_joint: -1.57
          arm_6_joint: -0.4
          arm_7_joint: 0.0

lift:
  torso:
    joint: torso_lift_joint
    controller: torso_controller
    limits: [0.0, 0.35]

gripper:
  gripper:
    arm: arm
    joint: gripper_right_finger_joint
    controller: gripper_controller
    positions:
      open: 0.044
      close: 0.0

power:
  robot_model: "tiago"

  power_system:
    system_voltage_v: 36.0
    global_drivetrain_efficiency: 0.85
    heating_coefficient_ch: 0.05
    battery_capacity_wh: 1440.0
    drivetrain_damping: 0.05
    drivetrain_friction: 0.1
    rolling_resistance_crr: 0.02

  joint_metrics:
    topic: "joint_states"

  static_power_w:
    compute_core: 40.0
    idle_motors: 15.0

acoustics:
  L_base_0: 40.0
  beta_0: 43.0
  beta_1: 16.0
  beta_2: 4.5
  beta_3: 2.5
  omega_ref: 6.0
  tau_ref: 8.0
  omega_deadband: 0.05
  omega_active: 0.2
  sigma_base: 1.0
  sigma_dynamic: 0.8
  sigma_no_effort: 1.0
