mobile:
  odom_frame: odom
  climbs: [stairs]

  footprint_padding: 0.23

  polygons_dict:
    StopPolygon:
      type: polygon
      points: [[0.19, 0.09], [0.19, -0.09], [-0.19, -0.09], [-0.19, 0.09]]
      action_type: stop
      min_points: 4
      visualize: true
      polygon_pub_topic: polygon_stop
      enabled: true

  velocity_limits:
    linear: [-0.5, 0.5]
    angular: [-1.0, 1.0]

  acceleration_limits:
    linear: 2.0
    angular: 3.0

  planar:
    velocity: {linear: [-0.5, 0.5], lateral: [-0.25, 0.25], angular: [-1.0, 1.0]}
    acceleration: {linear: .inf, lateral: .inf, angular: .inf}
    gain: {linear: 1.0, lateral: 1.0, angular: 1.0}
    lag: 0.25
    traction: .inf
    pivot: 0.0
    timeout: 0.5

  actions:
    continuous:
      linear:
        min: -0.5
        max: 0.5
      angular:
        min: -1.0
        max: 1.0
    discrete:
      - angular: 0.0
        linear: 0.3
        name: move_forward
      - angular: 0.0
        linear: -0.15
        name: move_backward
      - angular: 0.35
        linear: 0.15
        name: turn_left
      - angular: -0.35
        linear: 0.15
        name: turn_right
      - angular: 0.75
        linear: 0.0
        name: turn_strong_left
      - angular: -0.75
        linear: 0.0
        name: turn_strong_right
      - angular: 0.0
        linear: 0.0
        name: stop

  nav2:
    local_observation:
      min_obstacle_height: 0.2
    global_observation:
      include: [lidar_points]
      min_obstacle_height: 0.2
      obstacle_max_range: 5.0
      raytrace_max_range: 12.0

power:
  robot_model: "go1"

  power_system:
    system_voltage_v: 22.2
    global_drivetrain_efficiency: 0.85
    heating_coefficient_ch: 0.25
    battery_capacity_wh: 133.2
    drivetrain_damping: 0.050
    drivetrain_friction: 0.100
    rolling_resistance_crr: 0.000

  joint_metrics:
    topic: "joint_states"

  static_power_w:
    compute_core: 18.0
    idle_motors: 6.0

acoustics:
  L_base_0: 48.0
  beta_0: 53.0
  beta_1: 21.0
  beta_2: 6.5
  beta_3: 3.8
  omega_ref: 8.0
  tau_ref: 12.0
  omega_deadband: 0.05
  omega_active: 0.2
  sigma_base: 1.2
  sigma_dynamic: 1.0
  sigma_no_effort: 1.0
