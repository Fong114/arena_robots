mobile:
  source: https://robotnik.eu/wp-content/uploads/2024/10/Robotnik_Datasheet_RB-VOGUI_2024_EN.pdf
  odom_frame: odom

  polygons_dict:
    StopPolygon:
      type: polygon
      points: [[0.3, 0.2], [0.3, -0.2], [-0.3, -0.2], [-0.3, 0.2]]
      action_type: stop
      min_points: 3
      visualize: true
      polygon_pub_topic: polygon_stop
      enabled: true

  velocity_limits:
    linear: [-2.5, 2.5]
    angular: [-2.0, 2.0]

  planar:
    velocity: {linear: [-.inf, .inf], lateral: [-.inf, .inf], angular: [-.inf, .inf]}
    acceleration: {linear: .inf, lateral: .inf, angular: .inf}
    gain: {linear: 1.0, lateral: 1.0, angular: 1.0}
    lag: 0.0
    traction: 8.83
    pivot: 0.0
    timeout: 0.5

  actions:
    continuous:
      linear:
        min: -0.3
        max: 0.3
      angular:
        min: -0.3
        max: 0.3
    discrete:
    - {name: move_forward,  linear: 0.3,  angular: 0.0}
    - {name: move_backward, linear: -0.3, angular: 0.0}
    - {name: turn_left,     linear: 0.0,  angular: 0.3}
    - {name: turn_right,    linear: 0.0,  angular: -0.3}
    - {name: strafe_left,   linear: 0.0,  lateral: 0.3,  angular: 0.0}
    - {name: strafe_right,  linear: 0.0,  lateral: -0.3, angular: 0.0}
    - {name: stop,          linear: 0.0,  angular: 0.0}

power:
  robot_model: "rbvogui"

  power_system:
    system_voltage_v: 24.0
    global_drivetrain_efficiency: 0.85
    heating_coefficient_ch: 0.05
    battery_capacity_wh: 270.0
    drivetrain_damping: 0.08
    drivetrain_friction: 0.2
    rolling_resistance_crr: 0.035

  joint_metrics:
    topic: "joint_states"

  static_power_w:
    compute_core: 20.0
    idle_motors: 15.0

acoustics:
  L_base_0: 40.0
  beta_0: 58.5
  beta_1: 20.0
  beta_2: 14.0
  beta_3: 0.0
  omega_ref: 10.2
  tau_ref: 2.0
  max_joint_torque_nm: 15.0
  omega_deadband: 0.05
  omega_active: 0.50
  sigma_base: 0.8
  sigma_dynamic: 1.2
  sigma_no_effort: 2.0
